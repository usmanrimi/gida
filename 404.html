<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GIDA — Redirecting</title>
  <script>
    (function() {
      var p = window.location.pathname;
      if (p.indexOf('/admin') !== -1) {
        window.location.replace('/admin.html' + window.location.search + window.location.hash);
      } else {
        window.location.replace('/index.html');
      }
    })();
  </script>
</head>
<body style="font-family:system-ui,sans-serif;background:#0d231d;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Loading... If you are not redirected automatically, <a href="/index.html" style="color:#d9822b;">click here</a>.</p>
</body>
</html>
